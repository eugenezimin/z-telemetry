[package]
name = "z-telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Telemetry for services: readable, coloured one-line console logs and OpenTelemetry export (traces and logs over OTLP) from the same tracing events, with W3C trace propagation."
readme = "README.md"
keywords = ["tracing", "logging", "opentelemetry", "otlp", "microservices"]
categories = ["development-tools::debugging"]

[dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
