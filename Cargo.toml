[package]
name = "z-telemetry"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Telemetry for services: readable, coloured one-line console logs and OpenTelemetry export (traces and logs over OTLP) from the same tracing events, with W3C trace propagation."
readme = "README.md"
keywords = ["tracing", "logging", "opentelemetry", "otlp", "microservices"]
categories = ["development-tools::debugging"]

[dependencies]
# Local time without the `time` crate's refusal of the local offset in multi-threaded processes.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
humantime-serde = "1"
serde = { version = "1", features = ["derive"] }
nu-ansi-term = "0.50"
thiserror = "2"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }

[dev-dependencies]
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
dbg_macro = "deny"
